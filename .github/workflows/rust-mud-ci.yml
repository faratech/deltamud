name: Rust MUD CI

on:
  push:
    paths:
      - "rust-mud/**"
      - "lib/**"
      - "deltamud_schema.sql"
      - "AGREEMENT"
      - ".github/workflows/rust-mud-ci.yml"
  pull_request:
    paths:
      - "rust-mud/**"
      - "lib/**"
      - "deltamud_schema.sql"
      - "AGREEMENT"
      - ".github/workflows/rust-mud-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: rust-mud

jobs:
  build-test-clippy:
    name: build / test / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install sandbox runtime
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Prove unprivileged sandbox support
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          bwrap_probe() {
            bwrap --unshare-all --unshare-user --new-session --uid 1 --gid 1 \
              --cap-drop ALL --disable-userns \
              --proc /proc --dev /dev --tmpfs /run --tmpfs /tmp \
              --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
              --symlink usr/lib64 /lib64 -- /bin/true
          }
          if ! bwrap_probe; then
            if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
              echo "unprivileged bubblewrap is unavailable on this self-hosted runner" >&2
              exit 1
            fi
            if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            bwrap_probe
          fi

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust-mud

      - name: Check
        run: cargo check --all-targets --locked

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build release
        run: cargo build --release --locked

      - name: Test in the default parallel mode
        run: cargo test --locked

      - name: Test in serial mode
        run: cargo test --locked -- --test-threads=1

      - name: Prove an injected test failure is rejected
        run: |
          cargo test --locked --test ci_negative_control
          evidence="${RUNNER_TEMP}/ci-negative-control.log"
          set +e
          MUD_CI_FORCE_TEST_FAILURE=1 cargo test --locked --test ci_negative_control \
            2>&1 | tee "$evidence"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "injected test failure was incorrectly accepted" >&2
            exit 1
          fi
          if ! grep -Fq "intentional CI failure injection" "$evidence"; then
            echo "negative control failed for an unexpected reason" >&2
            exit 1
          fi

      - name: Clippy
        run: scripts/clippy-check.sh

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version '=0.22.2' --locked
          cargo audit --deny warnings --file Cargo.lock

      - name: Validate release tools
        run: |
          python3 -m py_compile scripts/soak_combat.py scripts/soak_combat_test.py scripts/playthrough.py scripts/playthrough_test.py scripts/parity/driver.py scripts/parity/test_driver.py
          python3 scripts/soak_combat_test.py
          python3 scripts/playthrough_test.py
          python3 scripts/parity/test_driver.py
          bash -n build.sh scripts/balance-check.sh scripts/canary.sh scripts/clippy-check.sh scripts/db-check.sh scripts/parity-check.sh scripts/release.sh scripts/systemd-check.sh
          scripts/systemd-check.sh

      - name: Prove the parity driver fails closed
        run: |
          set +e
          python3 scripts/parity/driver.py --force-driver-error
          status=$?
          set -e
          if [ "$status" -ne 97 ]; then
            echo "parity driver negative control returned $status, expected 97" >&2
            exit 1
          fi

      - name: Prepare private canary evidence workspace
        run: |
          raw="${RUNNER_TEMP}/deltamud-canary-raw"
          upload="${RUNNER_TEMP}/deltamud-canary-upload"
          for path in "$raw" "$upload"; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "canary evidence path unexpectedly exists: $path" >&2
              exit 1
            fi
          done
          umask 077
          mkdir -m 0700 -- "$raw"

      - name: Prove unsafe canary evidence is quarantined
        run: |
          test_root=$(mktemp -d "${RUNNER_TEMP}/canary-boundary-test.XXXXXX")
          trap 'chmod -R u+rwX "$test_root" 2>/dev/null || true; rm -rf -- "$test_root"' EXIT
          mkdir -m 0700 -- "$test_root/raw"
          printf '%s\n' 'safe diagnostic' >"$test_root/raw/diagnostic.log"
          ln -s /etc/passwd "$test_root/raw/unsafe-link"
          bash scripts/canary.sh --stage-evidence "$test_root/raw" "$test_root/upload"
          [ -f "$test_root/upload/EVIDENCE_REJECTED.txt" ]
          [ ! -e "$test_root/upload/diagnostic.log" ]
          [ -z "$(find -P "$test_root/upload" \! -type d \! -type f -print -quit)" ]
          [ -z "$(find -P "$test_root/upload" -type f -links +1 -print -quit)" ]

      - name: Run bounded live canary
        timeout-minutes: 5
        run: |
          set +e
          bash scripts/canary.sh --seconds 5 --players 1 \
            --artifacts "${RUNNER_TEMP}/deltamud-canary-raw/happy" \
            2>&1 | tee "${RUNNER_TEMP}/deltamud-canary-raw/happy.output"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Prove live-gate negative controls are rejected
        timeout-minutes: 12
        run: |
          expect_red() {
            control=$1
            expected_status=$2
            evidence="${RUNNER_TEMP}/deltamud-canary-raw/$control.output"
            set +e
            bash scripts/canary.sh --seconds 1 --players 1 \
              --negative-control "$control" \
              --artifacts "${RUNNER_TEMP}/deltamud-canary-raw/$control" \
              2>&1 | tee "$evidence"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne "$expected_status" ]; then
              echo "negative control $control returned $status, expected $expected_status" >&2
              exit 1
            fi
            if ! grep -Fq "[canary-negative] observed $control" "$evidence"; then
              echo "negative control $control lacked its injection evidence" >&2
              exit 1
            fi
          }
          expect_red kill-server 91
          expect_red freeze-pulses 92
          expect_red driver 93

      - name: Stage validated canary evidence
        id: stage_canary_evidence
        if: always()
        run: >-
          bash scripts/canary.sh --stage-evidence
          "${RUNNER_TEMP}/deltamud-canary-raw"
          "${RUNNER_TEMP}/deltamud-canary-upload"

      - name: Archive validated canary evidence
        if: always() && steps.stage_canary_evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-mud-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deltamud-canary-upload
          if-no-files-found: error

      - name: Reject quarantined canary evidence
        if: always() && steps.stage_canary_evidence.outcome == 'success'
        run: |
          if [ -e "${RUNNER_TEMP}/deltamud-canary-upload/EVIDENCE_REJECTED.txt" ]; then
            echo "raw canary evidence failed the safe upload boundary" >&2
            exit 1
          fi

  mysql-persistence:
    name: MariaDB persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust-mud

      - name: Install MariaDB tools
        run: sudo apt-get update && sudo apt-get install --yes mariadb-server mariadb-client

      - name: Run isolated persistence gate
        run: scripts/db-check.sh
