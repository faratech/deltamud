[package]
name = "deltamud"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
mysql_async = "0.37"
chrono = "0.4"
sha2 = "0.11"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
bitflags = "2.13"
async-trait = "0.1"
libc = "0.2"
indexmap = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# MUST stay "unwind": game.rs's catch_unwind crash-isolation (a panic in one
# command must not kill the whole server) depends on stack unwinding. Do NOT
# set panic = "abort".
panic = "unwind"
